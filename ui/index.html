<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>token-inspectour</title>
<style>
:root{
  --bg:#f7f7f5;--panel:#ffffff;--ink:#1a1a1a;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--soft:#f1f5f9;--code:#0f172a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#171a21;--ink:#e6e6e6;--muted:#9aa3b2;--line:#2a2f3a;--soft:#1f2430;--code:#e2e8f0}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans)}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
code,pre,.mono{font-family:var(--mono);font-size:12px}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;gap:14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;letter-spacing:.2px}
header .kv{color:var(--muted)}
header .kv b{color:var(--ink);font-weight:600}
header .grow{flex:1}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.pill.ok{border-color:#16a34a;color:#16a34a}.pill.warn{border-color:#d97706;color:#d97706}.pill.bad{border-color:#dc2626;color:#dc2626}
#main{display:grid;grid-template-columns:300px 1fr;min-height:0}
#main.with-side{grid-template-columns:300px 1fr 440px}
#left{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
#center{overflow:auto;min-width:0}
#side{border-left:1px solid var(--line);overflow:auto;background:var(--panel);display:none}
#main.with-side #side{display:block}
.sess{border-bottom:1px solid var(--line)}
.sess>.hd{padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.sess>.hd:hover{background:var(--soft)}
.sess>.hd .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sess.sel>.hd{background:var(--soft)}
.req{padding:6px 12px 6px 22px;cursor:pointer;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:baseline}
.req:hover{background:var(--soft)}
.req.sel{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.req .seq{font-family:var(--mono);color:var(--muted);font-size:11px}
.req .tok{font-family:var(--mono);font-size:11px;text-align:right;white-space:nowrap}
.req .prev{grid-column:1/4;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req.side .prev{font-style:italic}
.k{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.tabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.tabs button{border-radius:6px 6px 0 0;border-bottom:none;background:transparent}
.tabs button.on{background:var(--soft);border-color:var(--line);font-weight:600}
.view{padding:12px 14px}
.bar{display:flex;height:18px;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.bar>div{height:100%;min-width:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:12px}
.legend .item{cursor:pointer}
.legend .item.off{opacity:.35}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:34px;background:var(--panel)}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
tr.hover td{background:var(--soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.unused td{color:var(--muted)}
.group{margin:10px 0 18px}
.group>h3{font-size:13px;margin:8px 0 4px;display:flex;gap:10px;align-items:baseline}
.group>h3 .sum{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:11px}
.part{border:1px solid var(--line);border-radius:6px;margin:4px 0;background:var(--panel)}
.part>.hd{display:grid;grid-template-columns:14px 1fr auto auto auto;gap:10px;padding:5px 8px;cursor:pointer;align-items:center}
.part>.hd:hover{background:var(--soft)}
.part>.hd .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part>.hd .lab .sub{color:var(--muted);font-size:11px;margin-left:6px}
.part>.hd .n{font-family:var(--mono);font-size:11px;white-space:nowrap}
.part>.hd .n.est{color:var(--muted)}
.part .mini{display:flex;height:6px;width:120px;border-radius:2px;overflow:hidden;background:var(--soft)}
.part .mini>div{height:100%}
.part .body{border-top:1px solid var(--line);padding:8px;display:none}
.part.open .body{display:block}
.txt{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11.5px;line-height:1.5;max-height:70vh;overflow:auto;padding:6px;background:var(--bg);border-radius:4px}
.txt span.sp{border-radius:2px;padding:0 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone;cursor:pointer}
.txt span.sp.hl{outline:2px solid var(--accent)}
.txt span.sp.dim{opacity:.35}
.spans{margin:6px 0;display:flex;flex-wrap:wrap;gap:4px}
.spans .sp{font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.spans .sp.hl{outline:2px solid var(--accent)}
.muted{color:var(--muted)}
.small{font-size:11px}
.stat{display:inline-block;margin-right:18px}
.stat b{font-family:var(--mono);font-weight:600}
.diff .add{color:#16a34a}.diff .rem{color:#dc2626}.diff .chg{color:#d97706}
#side .hd{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;position:sticky;top:0;background:var(--panel)}
#side .hd .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#side .meta{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;word-break:break-all}
#side .txt{max-height:none;border-radius:0}
#side mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit}
.empty{padding:40px;text-align:center;color:var(--muted)}
.cmd{font-family:var(--mono);background:var(--soft);padding:2px 6px;border-radius:4px;user-select:all}
#log{font-family:var(--mono);font-size:11px;color:var(--muted);max-height:120px;overflow:auto;border-top:1px solid var(--line);padding:4px 12px;background:var(--panel)}
.steps{display:flex;gap:3px;align-items:flex-end;height:120px;padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:8px;overflow-x:auto}
.steps .st{display:flex;flex-direction:column-reverse;width:22px;min-width:22px;cursor:pointer;border-radius:2px 2px 0 0;overflow:hidden}
.steps .st:hover{outline:1px solid var(--accent)}
.steps .st>div{width:100%}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:4px 8px;border-radius:4px;font-size:11px;z-index:50;max-width:420px;display:none}
.toolgrp{margin:6px 0}
.toolgrp summary{cursor:pointer;padding:4px 0}
.toolgrp .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>token-inspectour</h1>
    <span class="kv">project <b id="h-project">…</b></span>
    <span class="kv">proxy <span class="cmd" id="h-cmd">…</span></span>
    <span class="grow"></span>
    <span id="h-counter" class="pill">counter</span>
    <span id="h-inv" class="pill">inventory</span>
    <button id="b-rescan" title="Rescan CLAUDE.md / skills / agents / settings">rescan</button>
    <button id="b-clear" title="Delete all captured sessions">clear</button>
  </header>
  <div id="main">
    <div id="left"><div class="empty">Waiting for the first request…<br><br>Run <span class="cmd" id="l-cmd"></span></div></div>
    <div id="center"><div class="empty">Select a step on the left.</div></div>
    <div id="side"></div>
  </div>
</div>
<div class="tip" id="tip"></div>
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n) => n == null ? '–' : n.toLocaleString();
const pct = (a,b) => b ? (100*a/b).toFixed(1)+'%' : '–';

const S = {
  state:null, sessions:[], kinds:{}, sources:[], sel:null, selSession:null, rec:null, tab:'anatomy', hiddenKinds:new Set(),
  cache:new Map(), hlSource:null, sessionAnalyses:new Map(),
};

async function api(p, opt){ const r = await fetch(p, opt); if(!r.ok) throw new Error(p+' '+r.status); return r.json(); }
function kindColor(k){ return (S.kinds[k]||{}).color || '#94a3b8'; }
function kindLabel(k){ return (S.kinds[k]||{}).label || k; }
function srcById(id){ return recSources().find(s=>s.id===id) || (S.rec && S.rec.adhocSources||[]).find(s=>s.id===id); }
function recSources(){ return (S.rec && S.rec.inventory && S.rec.inventory.sources) || S.sources; }
const short = (p) => (p||'').replace(/^\/Users\/[^/]+/, '~');

async function loadState(){
  S.state = await api('/api/state');
  S.kinds = S.state.kinds; S.sources = S.state.inventory.sources; S.sessions = S.state.sessions;
  $('#h-project').textContent = short(S.state.projectDir) + (S.state.projects.length>1 ? ` (+${S.state.projects.length-1} detected)` : '');
  $('#h-project').title = 'default project; each session\'s project is detected from its requests:\n' + S.state.projects.map(short).join('\n');
  const cmd = `ANTHROPIC_BASE_URL=${S.state.proxyUrl} claude`;
  $('#h-cmd').textContent = cmd; $('#l-cmd').textContent = cmd;
  renderHeaderPills(); renderLeft();
  if (!S.sel && S.sessions[0] && S.sessions[0].requests.length) { S.selSession = S.sessions[0].id; select(S.sessions[0].requests[S.sessions[0].requests.length-1].id); }
}
function renderHeaderPills(){
  const c = S.state.counter;
  const el = $('#h-counter');
  el.className = 'pill ' + (c.ready ? 'ok' : c.enabled ? 'warn' : '');
  el.textContent = !c.enabled ? 'tokens: estimates only' : c.ready ? `tokens: exact (${c.stats.calls} calls, ${c.cacheSize} cached${c.queue?`, ${c.queue} queued`:''})` : 'tokens: exact after first request';
  el.title = c.stats.lastError ? 'last error: '+c.stats.lastError : 'exact counts come from /v1/messages/count_tokens using the captured session auth';
  $('#h-inv').textContent = `${S.sources.length} sources`;
  $('#h-inv').title = 'CLAUDE.md, rules, skills, commands, agents, settings, MCP, memory, plugins found for this project';
}
function renderLeft(){
  const left = $('#left');
  if (!S.sessions.length) return;
  left.innerHTML = S.sessions.map(s => {
    const open = s.id === S.selSession;
    const main = s.requests.filter(r=>r.kind==='main');
    const last = main[main.length-1];
    const tot = last && last.usage ? (last.usage.input||0)+(last.usage.cacheRead||0)+(last.usage.cacheWrite||0) : null;
    return `<div class="sess ${open?'sel':''}" data-id="${s.id}">
      <div class="hd" data-sess="${s.id}" title="${esc(s.projectDir||'')}"><span>${open?'▾':'▸'}</span><b>${esc((s.projectDir||'').split('/').pop()||s.id.slice(0,8))}</b><span class="muted small">${new Date(s.startedAt).toLocaleString()}</span><span class="grow"></span><span class="small mono">${s.requests.length} calls${tot?` · ctx ${fmt(tot)}`:''}</span></div>
      ${open ? s.requests.map(r => reqRow(r)).join('') : ''}
    </div>`;
  }).join('');
  left.querySelectorAll('[data-sess]').forEach(h => h.onclick = () => { S.selSession = S.selSession===h.dataset.sess ? null : h.dataset.sess; renderLeft(); if(S.selSession) renderSessionOverview(); });
  left.querySelectorAll('.req').forEach(r => r.onclick = () => select(r.dataset.id));
}
function reqRow(r){
  const u = r.usage || {};
  const tot = u.input!=null ? (u.input||0)+(u.cacheRead||0)+(u.cacheWrite||0) : null;
  const side = r.kind !== 'main';
  const st = r.status==null ? '<span class="pill warn">…</span>' : r.status>=400 ? `<span class="pill bad">${r.status}</span>` : '';
  return `<div class="req ${side?'side':''} ${r.id===S.sel?'sel':''}" data-id="${r.id}">
    <span class="seq">#${r.seq}</span>
    <span>${side?`<span class="pill">${esc(r.kind.replace('side:',''))}</span>`:r.kind.startsWith('main:')?`<b>${esc(r.kind.slice(5))}</b>`:`<b>turn</b>`} <span class="muted small">${esc((r.model||'').replace('claude-',''))}</span> ${st}</span>
    <span class="tok" title="prompt tokens from usage: uncached + cache read + cache write | output">${tot!=null?fmt(tot):'…'}${u.output!=null?` <span class="muted">→${fmt(u.output)}</span>`:''}</span>
    <span class="prev">${esc(r.userPreview||'')}${r.assistantPreview?` <span class="muted">⇢ ${esc(r.assistantPreview)}</span>`:''}</span>
  </div>`;
}

async function select(id){
  S.sel = id; S.hlSource=null;
  const rec = await api(`/api/requests/${id}?full=1`);
  S.rec = rec; S.selSession = rec.sessionId;
  renderLeft(); renderCenter();
}
function renderCenter(){
  const rec = S.rec; if (!rec) return;
  const c = $('#center');
  const tabs = ['anatomy','sources','diff','response','raw'];
  c.innerHTML = `<div class="tabs">${tabs.map(t=>`<button class="${S.tab===t?'on':''}" data-tab="${t}">${t}</button>`).join('')}
    <span class="grow"></span><span class="small muted" style="padding:6px 8px">#${rec.seq} · ${esc(rec.kind)} · ${esc(rec.model||'')} · ${rec.durationMs?rec.durationMs+' ms':'in flight'}${rec.ttftMs?` · first token ${rec.ttftMs} ms`:''}</span>
    <button data-act="recount" title="Re-run exact token counting for this request">recount</button></div><div class="view" id="view"></div>`;
  c.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab=b.dataset.tab; renderCenter(); });
  $('[data-act=recount]', c).onclick = async () => { await api(`/api/requests/${rec.id}/recount`, {method:'POST'}); select(rec.id); };
  const v = $('#view');
  if (!rec.analysis) { v.innerHTML = '<div class="empty">Analyzing…</div>'; return; }
  ({anatomy:renderAnatomy, sources:renderSources, diff:renderDiff, response:renderResponse, raw:renderRaw})[S.tab](v, rec);
}

function summaryBlock(rec){
  const a = rec.analysis, t = a.totals;
  const kinds = Object.entries(t.byKind).sort((x,y)=>y[1].tokens-x[1].tokens);
  const total = t.tokens || 1;
  const u = a.cache;
  const bar = `<div class="bar" id="kindbar">${kinds.map(([k,v])=>`<div style="width:${100*v.tokens/total}%;background:${kindColor(k)}" data-kind="${k}" title="${esc(kindLabel(k))}: ${fmt(v.tokens)} tokens (${pct(v.tokens,total)})"></div>`).join('')}</div>`;
  const legend = `<div class="legend">${kinds.map(([k,v])=>`<span class="item ${S.hiddenKinds.has(k)?'off':''}" data-kind="${k}"><span class="k" style="background:${kindColor(k)}"></span>${esc(kindLabel(k))} <b class="mono">${fmt(v.tokens)}</b> <span class="muted">${pct(v.tokens,total)}</span></span>`).join('')}</div>`;
  const exactNote = a.exactTotal ? `<span class="pill ok">exact: ${a.counted}/${a.partCount} parts counted</span>` : a.counted ? `<span class="pill warn">partially exact: ${a.counted}/${a.partCount} parts</span>` : `<span class="pill">estimated (≈)</span>`;
  const usage = u ? `<span class="stat">prompt (server usage) <b>${fmt(a.promptTotalFromUsage)}</b></span><span class="stat">cache read <b>${fmt(u.read)}</b></span><span class="stat">cache write <b>${fmt(u.write)}</b></span><span class="stat">uncached <b>${fmt(u.uncached)}</b></span>` : `<span class="stat muted">no usage yet</span>`;
  const delta = a.promptTotalFromUsage!=null ? a.promptTotalFromUsage - t.tokens : null;
  const sum = `<span class="stat">sum of parts <b>${fmt(t.tokens)}</b></span>${delta!=null?`<span class="stat" title="server usage total minus the sum of attributed parts: request-level extras such as structured-output schemas, thinking config, or counting drift">unattributed Δ <b>${delta>=0?'+':''}${fmt(delta)}</b></span>`:''}${a.toolsOverhead!=null?`<span class="stat" title="tokens the API adds for the tool-use system prompt beyond the individual tool definitions">tools framing overhead <b>${fmt(a.toolsOverhead)}</b></span>`:''}`;
  return `<div style="margin-bottom:10px">${bar}${legend}<div class="small">${usage} ${sum} ${exactNote}</div></div>`;
}

function renderAnatomy(v, rec){
  const a = rec.analysis;
  const parts = a.parts;
  const grp = (area) => parts.filter(p=>p.area===area);
  const sumT = (ps) => ps.reduce((x,p)=>x+(p.tokens||0),0);
  let html = summaryBlock(rec);
  const areas = [['system','System prompt'],['tools','Tools'],['messages','Messages']];
  for (const [area,label] of areas){
    const ps = grp(area); if(!ps.length) continue;
    html += `<div class="group"><h3>${label} <span class="sum">${ps.length} parts · ${fmt(sumT(ps))} tokens${area==='tools'&&a.toolsTotal!=null?` · ${fmt(a.toolsTotal)} incl. framing`:''}${area==='system'&&a.systemTotal!=null?` · ${fmt(a.systemTotal)} counted together`:''}</span></h3>`;
    if (area==='tools'){
      const groups = {};
      for (const p of ps){ const g = p.blockType==='framing' ? 'Tool-use framing (added by the API once per request)' : p.kind==='harness-tool' ? 'Built-in tools' : `MCP: ${p.name.split('__')[1]}`; (groups[g] ||= []).push(p); }
      for (const [g, gp] of Object.entries(groups)) html += `<details class="toolgrp"><summary><span class="k" style="background:${kindColor(gp[0].kind)}"></span>${esc(g)} <span class="n">${gp.length} tools · ${fmt(sumT(gp))} tokens</span></summary>${gp.sort((x,y)=>(y.tokens||0)-(x.tokens||0)).map(p=>partRow(p,a)).join('')}</details>`;
    } else html += ps.map(p=>partRow(p,a)).join('');
    html += `</div>`;
  }
  v.innerHTML = html;
  wireParts(v, rec);
}
function partRow(p, a){
  const total = p.tokens||0;
  const mini = p.spans.map(s=>`<div style="width:${100*(s.end-s.start)/Math.max(1,p.chars)}%;background:${kindColor(s.kind)}"></div>`).join('');
  const roleTag = p.area==='messages' ? `<span class="pill">${esc(p.role)}${p.blockType!=='text'?' · '+esc(p.blockType):''}</span> ` : '';
  const srcCount = new Set(p.spans.filter(s=>s.sourceId).map(s=>s.sourceId)).size;
  return `<div class="part" data-part="${p.id}"><div class="hd">
    <span class="k" style="background:${kindColor(p.spans.length===1?p.spans[0].kind:'harness')}"></span>
    <span class="lab">${roleTag}${esc(p.label)}${p.name&&p.area==='tools'?'':''}<span class="sub">${p.cache?'<span class="pill" title="cache_control breakpoint">cache ⏸</span> ':''}${srcCount?`${srcCount} source${srcCount>1?'s':''} · `:''}${fmt(p.chars)} chars</span></span>
    <span class="mini" title="span composition">${mini}</span>
    <span class="n ${p.exact?'':'est'}" title="${p.exact?'exact (count_tokens)':'estimate'}">${p.exact?'':'≈'}${fmt(total)}</span>
    <span class="n muted">${pct(total, a.totals.tokens)}</span>
  </div><div class="body"></div></div>`;
}
function wireParts(v, rec){
  v.querySelectorAll('.part').forEach(el => {
    const p = rec.analysis.parts.find(x=>x.id===el.dataset.part);
    $('.hd', el).onclick = () => { el.classList.toggle('open'); if (el.classList.contains('open') && !el.dataset.done){ el.dataset.done=1; $('.body', el).innerHTML = partBody(p); wireSpans(el, p);} };
  });
  v.querySelectorAll('.legend .item').forEach(el => el.onclick = () => { const k=el.dataset.kind; S.hiddenKinds.has(k)?S.hiddenKinds.delete(k):S.hiddenKinds.add(k); renderCenter(); });
  applyHidden(v);
}
function applyHidden(v){
  v.querySelectorAll('.txt span.sp').forEach(s => s.classList.toggle('dim', S.hiddenKinds.has(s.dataset.kind)));
}
const MAXTXT = 60000;
function partBody(p){
  const chips = p.spans.map((s,i)=>`<span class="sp" data-i="${i}" style="border-color:${kindColor(s.kind)};background:${kindColor(s.kind)}22">${esc(s.label||kindLabel(s.kind))} · ${s.exact?'':'≈'}${fmt(s.tokens)}</span>`).join('');
  const text = p.text || '';
  const trunc = text.length > MAXTXT;
  let html = '';
  for (let i=0;i<p.spans.length;i++){
    const s = p.spans[i];
    if (s.start >= MAXTXT) break;
    const seg = text.slice(s.start, Math.min(s.end, MAXTXT));
    html += `<span class="sp" data-i="${i}" data-kind="${s.kind}" ${s.sourceId?`data-src="${s.sourceId}"`:''} style="background:${kindColor(s.kind)}26;box-shadow:inset 0 -2px 0 ${kindColor(s.kind)}66">${esc(seg)}</span>`;
  }
  if (trunc) html += `<div class="muted">… ${fmt(text.length-MAXTXT)} more chars (open raw to see all)</div>`;
  return `<div class="spans">${chips}</div><div class="txt">${html}</div>`;
}
function wireSpans(el, p){
  const tip = $('#tip');
  el.querySelectorAll('.sp').forEach(s => {
    const i = +s.dataset.i; const sp = p.spans[i];
    s.onmouseenter = (e) => { tip.style.display='block'; tip.innerHTML = `<b>${esc(sp.label||kindLabel(sp.kind))}</b><br>${sp.exact?'':'≈'}${fmt(sp.tokens)} tokens · ${fmt(sp.end-sp.start)} chars${sp.match?` · match: ${esc(sp.match)}`:''}${sp.sourceId?'<br>click to open source':''}`; el.querySelectorAll(`.sp[data-i="${i}"]`).forEach(x=>x.classList.add('hl')); };
    s.onmousemove = (e) => { tip.style.left = Math.min(window.innerWidth-440, e.clientX+12)+'px'; tip.style.top = (e.clientY+12)+'px'; };
    s.onmouseleave = () => { tip.style.display='none'; el.querySelectorAll('.sp.hl').forEach(x=>x.classList.remove('hl')); };
    s.onclick = () => { if (sp.sourceId) openSource(sp.sourceId, p.text.slice(sp.start, sp.end)); };
  });
  applyHidden(el);
}

function renderSources(v, rec){
  const a = rec.analysis;
  const usage = a.totals.sourceUsage;
  const all = [...recSources(), ...(a.adhocSources||[])];
  const rows = all.map(s => ({s, u: usage[s.id] || {used:false,tokens:0,chars:0,spans:0,parts:[],matches:{},coverage:0}}))
    .sort((x,y)=> (y.u.tokens - x.u.tokens) || x.s.kind.localeCompare(y.s.kind) || x.s.name.localeCompare(y.s.name));
  const used = rows.filter(r=>r.u.used);
  const stepsFor = sessionStepsBySource();
  v.innerHTML = summaryBlock(rec) + `<div class="small muted" style="margin-bottom:8px">Project <b class="mono">${esc(short(rec.projectDir))}</b> · ${used.length} of ${all.length} inventory sources appear in this request. Hover a row to see where it lands; click to open the file. "coverage" = how much of the file is present verbatim; "steps" = which calls in this session include it.</div>
  <table><thead><tr><th></th><th>source</th><th>scope</th><th class="num">file size</th><th class="num">tokens here</th><th class="num">share</th><th class="num">coverage</th><th>match</th><th>where</th><th>steps</th></tr></thead><tbody>
  ${rows.map(({s,u}) => `<tr class="click ${u.used?'':'unused'}" data-src="${s.id}">
    <td><span class="k" style="background:${kindColor(s.kind)}"></span></td>
    <td><b>${esc(s.name)}</b> <span class="muted small">${esc(kindLabel(s.kind))}${s.adhoc?' (outside inventory)':''}</span><div class="muted small mono">${esc((s.path||'').replace(/^\/Users\/[^/]+/,'~'))}</div>${s.description?`<div class="small muted">${esc(s.description.slice(0,160))}</div>`:''}${s.hooks&&s.hooks.length?`<div class="small">hooks: ${s.hooks.map(h=>`<span class="pill">${esc(h.event)}${h.matcher?' '+esc(h.matcher):''}</span>`).join(' ')}</div>`:''}${s.servers?`<div class="small">servers: ${s.servers.map(x=>`<span class="pill">${esc(x.name)}</span>`).join(' ')}</div>`:''}</td>
    <td>${esc(s.scope)}</td><td class="num">${fmt(s.size)}</td><td class="num">${u.used?fmt(u.tokens):'<span class="muted">not sent</span>'}</td><td class="num">${u.used?pct(u.tokens,a.totals.tokens):''}</td><td class="num">${u.used?pct(u.chars, s.size||u.chars):''}</td>
    <td class="small">${Object.entries(u.matches).map(([k,n])=>`${esc(k)}×${n}`).join(', ')}</td>
    <td class="small">${u.parts.map(pid=>{const p=a.parts.find(x=>x.id===pid);return p?`<span class="pill" title="${esc(p.label)}">${esc(p.area==='messages'?`msg ${p.index}.${p.sub} ${p.role}`:p.id)}</span>`:''}).join(' ')}</td>
    <td class="small mono">${(stepsFor.get(s.id)||[]).join(' ')||''}</td>
  </tr>`).join('')}</tbody></table>`;
  v.querySelectorAll('tr[data-src]').forEach(tr => { tr.onclick = () => openSource(tr.dataset.src); });
  v.querySelectorAll('.legend .item').forEach(el => el.onclick = () => { const k=el.dataset.kind; S.hiddenKinds.has(k)?S.hiddenKinds.delete(k):S.hiddenKinds.add(k); renderCenter(); });
}
function sessionStepsBySource(){
  // which steps (seq numbers) of the current session include each source — from cached slim analyses
  const m = new Map();
  const sess = S.sessions.find(s=>s.id===S.selSession); if(!sess) return m;
  for (const r of sess.requests){
    const a = S.sessionAnalyses.get(r.id); if(!a) continue;
    for (const [sid,u] of Object.entries(a.totals.sourceUsage||{})) if(u.used) (m.get(sid)||m.set(sid,[]).get(sid)).push('#'+r.seq);
  }
  return m;
}
async function ensureSessionAnalyses(){
  const sess = S.sessions.find(s=>s.id===S.selSession); if(!sess) return;
  await Promise.all(sess.requests.map(async r => { if (S.sessionAnalyses.has(r.id) && r.status!=null) return; try { const rec = await api(`/api/requests/${r.id}`); if (rec.analysis) S.sessionAnalyses.set(r.id, rec.analysis); } catch{} }));
}

function renderDiff(v, rec){
  const a = rec.analysis; const d = a.diff;
  let html = summaryBlock(rec);
  if (!d) { html += `<div class="muted">First agent turn in this session (or a side call) — nothing to compare against.</div>`; v.innerHTML = html; return; }
  const prev = S.sessions.find(s=>s.id===rec.sessionId)?.requests.find(r=>r.id===a.prevId);
  html += `<div class="diff"><div class="small" style="margin-bottom:8px">Compared with step <b>#${prev?prev.seq:'?'}</b>: <span class="add">+${fmt(d.addedTokens)} added</span> · <span class="rem">−${fmt(d.removedTokens)} removed</span> · <span class="chg">${d.changedDelta>=0?'+':''}${fmt(d.changedDelta)} in changed parts</span> · ${d.sameCount} parts unchanged${a.cache?` · server reports cache read <b>${fmt(a.cache.read)}</b>, cache write <b>${fmt(a.cache.write)}</b>, uncached <b>${fmt(a.cache.uncached)}</b>`:''}</div>`;
  const row = (cls, sign, x) => `<tr><td class="${cls}">${sign}</td><td>${esc(x.label)} <span class="muted small mono">${esc(x.key)}</span></td><td class="num">${x.prevTokens!=null?fmt(x.prevTokens)+' → ':''}${fmt(x.tokens)}</td><td class="num">${x.prevChars!=null?fmt(x.prevChars)+' → ':''}${fmt(x.chars)}</td></tr>`;
  html += `<table><thead><tr><th></th><th>part</th><th class="num">tokens</th><th class="num">chars</th></tr></thead><tbody>
    ${d.added.map(x=>row('add','+',x)).join('')}${d.changed.map(x=>row('chg','~',x)).join('')}${d.removed.map(x=>row('rem','−',x)).join('')}</tbody></table></div>`;
  v.innerHTML = html;
  v.querySelectorAll('.legend .item').forEach(el => el.onclick = () => { const k=el.dataset.kind; S.hiddenKinds.has(k)?S.hiddenKinds.delete(k):S.hiddenKinds.add(k); renderCenter(); });
}

function renderResponse(v, rec){
  const r = rec.response;
  if (!r) { v.innerHTML = '<div class="empty">No response yet.</div>'; return; }
  const u = r.usage || {};
  let html = `<div class="small" style="margin-bottom:10px"><span class="stat">status <b>${rec.status}</b></span><span class="stat">stop <b>${esc(r.stop_reason||'')}</b></span><span class="stat">output tokens <b>${fmt(u.output_tokens)}</b></span><span class="stat">input <b>${fmt(u.input_tokens)}</b></span><span class="stat">cache read <b>${fmt(u.cache_read_input_tokens)}</b></span><span class="stat">cache write <b>${fmt(u.cache_creation_input_tokens)}</b></span><span class="stat">duration <b>${fmt(rec.durationMs)} ms</b></span><span class="stat">TTFB <b>${fmt(rec.ttfbMs)} ms</b></span><span class="stat">SSE events <b>${fmt(r.eventCount)}</b></span></div>`;
  if (r.error) html += `<pre class="txt">${esc(JSON.stringify(r.error,null,2))}</pre>`;
  for (const b of r.content||[]){
    const t = b.type==='text'?b.text:b.type==='thinking'?b.thinking:b.type==='tool_use'?JSON.stringify({name:b.name,input:b.input},null,2):JSON.stringify(b,null,2);
    html += `<div class="part open"><div class="hd"><span class="k" style="background:${kindColor('model')}"></span><span class="lab"><span class="pill">${esc(b.type)}</span> ${b.name?esc(b.name):''}</span><span></span><span class="n muted">${fmt((t||'').length)} chars</span><span></span></div><div class="body"><div class="txt">${esc(t)}</div></div></div>`;
  }
  if (r.context_management) html += `<h3>context_management</h3><pre class="txt">${esc(JSON.stringify(r.context_management,null,2))}</pre>`;
  v.innerHTML = html;
}
async function renderRaw(v, rec){
  v.innerHTML = '<div class="muted">loading…</div>';
  const raw = await api(`/api/requests/${rec.id}/raw`);
  const req = JSON.stringify(raw.request, null, 2);
  v.innerHTML = `<h3>Request headers</h3><pre class="txt">${esc(JSON.stringify(raw.headers,null,2))}</pre><h3>Request body <span class="muted small">${fmt(req.length)} chars</span></h3><pre class="txt" style="max-height:60vh">${esc(req.slice(0,400000))}${req.length>400000?'\n… truncated':''}</pre><h3>Response</h3><pre class="txt">${esc(JSON.stringify(raw.response,null,2).slice(0,200000))}</pre>`;
}

function renderSessionOverview(){
  // shown when a session header is clicked and no request selected yet: steps chart in center
  ensureSessionAnalyses().then(() => {
    if (S.rec && S.rec.sessionId===S.selSession) { if (S.tab==='sources') renderCenter(); return; }
    const sess = S.sessions.find(s=>s.id===S.selSession); if(!sess) return;
    const c = $('#center');
    const reqs = sess.requests.filter(r=>S.sessionAnalyses.has(r.id));
    const max = Math.max(1, ...reqs.map(r=>S.sessionAnalyses.get(r.id).totals.tokens));
    c.innerHTML = `<div class="view"><h3>Session ${esc(sess.id.slice(0,8))} · ${sess.requests.length} calls</h3><div class="steps">${reqs.map(r=>{const a=S.sessionAnalyses.get(r.id);const ks=Object.entries(a.totals.byKind);return `<div class="st" data-id="${r.id}" title="#${r.seq} ${esc(r.kind)} · ${fmt(a.totals.tokens)} tokens" style="height:${100*a.totals.tokens/max}%">${ks.map(([k,v])=>`<div style="height:${100*v.tokens/a.totals.tokens}%;background:${kindColor(k)}"></div>`).join('')}</div>`;}).join('')}</div><div class="muted small">Click a bar to open that step.</div></div>`;
    c.querySelectorAll('.st').forEach(el => el.onclick = () => select(el.dataset.id));
  });
}

async function openSource(id, matchedText){
  const side = $('#side'); $('#main').classList.add('with-side');
  side.innerHTML = '<div class="hd"><span class="t">loading…</span></div>';
  let s;
  try { s = await api(`/api/sources/${id}`); } catch { const ad = srcById(id); s = ad ? {...ad, content: '(file outside the scanned inventory — content not loaded)'} : {name:id, content:''}; }
  let content = esc(s.content||'');
  if (matchedText && s.content){ const i = s.content.indexOf(matchedText.trim().slice(0,200)); if (i>=0){ const j = i + Math.min(matchedText.trim().length, s.content.length-i); content = esc(s.content.slice(0,i)) + '<mark>' + esc(s.content.slice(i,j)) + '</mark>' + esc(s.content.slice(j)); } }
  const fm = s.frontmatter && Object.keys(s.frontmatter).length ? `<div class="meta">frontmatter: ${esc(JSON.stringify(s.frontmatter))}</div>` : '';
  side.innerHTML = `<div class="hd"><span class="k" style="background:${kindColor(s.kind)}"></span><span class="t" title="${esc(s.path)}">${esc(s.name)}</span><span class="pill">${esc(kindLabel(s.kind))}</span><span class="pill">${esc(s.scope||'')}</span><button data-act="close">✕</button></div>
    <div class="meta">${esc(s.path||'')} · ${fmt(s.size)} chars${s.mtime?` · modified ${new Date(s.mtime).toLocaleString()}`:''}</div>${fm}<div class="txt">${content}</div>`;
  $('[data-act=close]', side).onclick = () => { $('#main').classList.remove('with-side'); };
  if (matchedText) { const m = $('mark', side); if (m) m.scrollIntoView({block:'center'}); }
}

// live updates
function live(){
  const es = new EventSource('/events');
  const refresh = async (data) => {
    S.sessions = await api('/api/sessions');
    const st = await api('/api/state'); S.state = st; S.sources = st.inventory.sources; renderHeaderPills();
    if (!S.sel && data && data.id) { S.selSession = data.sessionId; select(data.id); }
    else renderLeft();
  };
  es.addEventListener('request', (e) => { const d = JSON.parse(e.data); refresh(d).then(()=>{ if(!S.sel) select(d.id); }); });
  es.addEventListener('response', (e) => { const d = JSON.parse(e.data); refresh(d); if (S.sel===d.id) select(d.id); });
  es.addEventListener('analysis', (e) => { const d = JSON.parse(e.data); refresh(d); S.sessionAnalyses.delete(d.id); if (S.sel===d.id) select(d.id); });
  es.addEventListener('inventory', () => refresh());
  es.addEventListener('cleared', () => { S.sel=null; S.rec=null; S.sessionAnalyses.clear(); location.reload(); });
  es.addEventListener('log', (e) => { /* reserved */ });
}
$('#b-rescan').onclick = () => api('/api/rescan',{method:'POST'});
$('#b-clear').onclick = () => { if (confirm('Delete all captured sessions?')) api('/api/clear',{method:'POST'}); };
loadState().then(live);
</script>
