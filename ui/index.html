<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>token-inspectour</title>
<meta name="inspectour-base" content="__INSPECTOUR_BASE__">
<meta name="inspectour-name" content="__INSPECTOUR_NAME__">
<style>
:root{
  --bg:#f7f7f5;--panel:#ffffff;--ink:#1a1a1a;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--soft:#f1f5f9;--code:#0f172a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#171a21;--ink:#e6e6e6;--muted:#9aa3b2;--line:#2a2f3a;--soft:#1f2430;--code:#e2e8f0}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans)}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
code,pre,.mono{font-family:var(--mono);font-size:12px}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;gap:14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;letter-spacing:.2px}
header .kv{color:var(--muted)}
header .kv b{color:var(--ink);font-weight:600}
header .grow{flex:1}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.pill.ok{border-color:#16a34a;color:#16a34a}.pill.warn{border-color:#d97706;color:#d97706}.pill.bad{border-color:#dc2626;color:#dc2626}
#main{display:grid;grid-template-columns:300px 1fr;min-height:0}
#main.with-side{grid-template-columns:300px 1fr 440px}
#left{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
#center{overflow:auto;min-width:0}
#side{border-left:1px solid var(--line);overflow:auto;background:var(--panel);display:none}
#main.with-side #side{display:block}
.sess{border-bottom:1px solid var(--line)}
.sess>.hd{padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.sess>.hd:hover{background:var(--soft)}
.sess>.hd .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sess.sel>.hd{background:var(--soft)}
.req{padding:6px 12px 6px 22px;cursor:pointer;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:baseline}
.req:hover{background:var(--soft)}
.req.sel{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.req .seq{font-family:var(--mono);color:var(--muted);font-size:11px}
.req .tok{font-family:var(--mono);font-size:11px;text-align:right;white-space:nowrap}
.req .prev{grid-column:1/4;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req.side .prev{font-style:italic}
.k{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.tabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.tabs button{border-radius:6px 6px 0 0;border-bottom:none;background:transparent}
.tabs button.on{background:var(--soft);border-color:var(--line);font-weight:600}
.view{padding:12px 14px}
.bar{display:flex;height:18px;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.bar>div{height:100%;min-width:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:12px}
.legend .item{cursor:pointer}
.legend .item.off{opacity:.35}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:34px;background:var(--panel)}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
tr.hover td{background:var(--soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.unused td{color:var(--muted)}
.group{margin:10px 0 18px}
.group>h3{font-size:13px;margin:8px 0 4px;display:flex;gap:10px;align-items:baseline}
.group>h3 .sum{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:11px}
.part{border:1px solid var(--line);border-radius:6px;margin:4px 0;background:var(--panel)}
.part>.hd{display:grid;grid-template-columns:14px 1fr auto auto auto;gap:10px;padding:5px 8px;cursor:pointer;align-items:center}
.part>.hd:hover{background:var(--soft)}
.part>.hd .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part>.hd .lab .sub{color:var(--muted);font-size:11px;margin-left:6px}
.part>.hd .n{font-family:var(--mono);font-size:11px;white-space:nowrap}
.part>.hd .n.est{color:var(--muted)}
.part .mini{display:flex;height:6px;width:120px;border-radius:2px;overflow:hidden;background:var(--soft)}
.part .mini>div{height:100%}
.part .body{border-top:1px solid var(--line);padding:8px;display:none}
.part.open .body{display:block}
.txt{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11.5px;line-height:1.5;max-height:70vh;overflow:auto;padding:6px;background:var(--bg);border-radius:4px}
.txt span.sp{border-radius:2px;padding:0 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone;cursor:pointer}
.txt span.sp.hl{outline:2px solid var(--accent)}
.txt span.sp.dim{opacity:.35}
.spans{margin:6px 0;display:flex;flex-wrap:wrap;gap:4px}
.spans .sp{font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.spans .sp.hl{outline:2px solid var(--accent)}
.muted{color:var(--muted)}
.small{font-size:11px}
.stat{display:inline-block;margin-right:18px}
.stat b{font-family:var(--mono);font-weight:600}
.diff .add{color:#16a34a}.diff .rem{color:#dc2626}.diff .chg{color:#d97706}
#side .hd{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;position:sticky;top:0;background:var(--panel)}
#side .hd .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#side .meta{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;word-break:break-all}
#side .txt{max-height:none;border-radius:0}
#side mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit}
.empty{padding:40px;text-align:center;color:var(--muted)}
.cmd{font-family:var(--mono);background:var(--soft);padding:2px 6px;border-radius:4px;user-select:all}
.modes button{border-radius:6px;margin-left:-1px}
.modes button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
#graph{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#main.graph #center{display:none}
#main.graph #graph[hidden]{display:flex}
.gbar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.gbar .seg{display:inline-flex}
.gbar .seg button{border-radius:0;margin-left:-1px}
.gbar .seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.gbar .seg button:last-child{border-radius:0 6px 6px 0}
.gbar .seg button.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600;position:relative;z-index:1}
#cy{flex:1;min-height:0}
.glegend{position:absolute;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 12px;max-width:70%;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);font-size:11px;pointer-events:none}
.glegend:empty{display:none}
#graph .empty{position:absolute;inset:44px 0 0 0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#graph .empty[hidden]{display:none}
#gdetail{padding:10px 12px;font-size:12px}
#gdetail h4{margin:10px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
#gdetail .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
#gdetail .kv b{font-family:var(--mono);font-weight:500}
#gdetail pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:var(--bg);padding:6px;border-radius:4px;max-height:40vh;overflow:auto}
#log{font-family:var(--mono);font-size:11px;color:var(--muted);max-height:120px;overflow:auto;border-top:1px solid var(--line);padding:4px 12px;background:var(--panel)}
.steps{display:flex;gap:3px;align-items:flex-end;height:120px;padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:8px;overflow-x:auto}
.steps .st{display:flex;flex-direction:column-reverse;width:22px;min-width:22px;cursor:pointer;border-radius:2px 2px 0 0;overflow:hidden}
.steps .st:hover{outline:1px solid var(--accent)}
.steps .st>div{width:100%}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:4px 8px;border-radius:4px;font-size:11px;z-index:50;max-width:420px;display:none}
.toolgrp{margin:6px 0}
.toolgrp summary{cursor:pointer;padding:4px 0}
.toolgrp .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>token-inspectour <span class="pill" id="h-name" title="agent name (route prefix)">…</span></h1>
    <span class="kv">project <b id="h-project">…</b></span>
    <span class="kv">proxy <span class="cmd" id="h-cmd">…</span></span>
    <span class="grow"></span>
    <span class="modes"><button id="b-inspect" class="on">inspect</button><button id="b-graph">flow-graph</button></span>
    <span id="h-counter" class="pill">counter</span>
    <span id="h-inv" class="pill">inventory</span>
    <button id="b-rescan" title="Rescan CLAUDE.md / skills / agents / settings">rescan</button>
    <button id="b-clear" title="Delete all captured sessions">clear</button>
  </header>
  <div id="main">
    <div id="left"><div class="empty">Waiting for the first request…<br><br>Run <span class="cmd" id="l-cmd"></span></div></div>
    <div id="center"><div class="empty">Select a step on the left.</div></div>
    <div id="graph" hidden>
      <div class="gbar">
        <span class="seg"><button data-gmode="flow" class="on" title="Turns, tool calls, MCP, subagents and side calls of the selected session">session flow</button><button data-gmode="context" title="Which sources feed which part of the selected request">turn context</button></span>
        <span class="seg"><button data-gdir="LR" class="on" title="left to right">→</button><button data-gdir="TB" title="top to bottom">↓</button></span>
        <button data-gact="fit" title="fit to view">fit</button>
        <button data-gact="relayout" title="run the layout again">relayout</button>
        <span class="grow"></span>
        <span id="gstats" class="small muted"></span>
      </div>
      <div id="cy"></div>
      <div id="glegend" class="glegend"></div>
      <div id="gempty" class="empty">Select a session on the left to draw its flow.</div>
    </div>
    <div id="side"></div>
  </div>
</div>
<div class="tip" id="tip"></div>
<script src="vendor/dagre.min.js"></script>
<script src="vendor/cytoscape.min.js"></script>
<script src="vendor/cytoscape-dagre.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
